<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareerOS 手机接码</title><link rel="stylesheet" href="/dashboard.css"><script src="/dashboard.js" defer></script></head>
<body><main><h1>CareerOS 手机接码</h1><p>本页仅供本机配对与短信回填测试。真实短信需要你在手机确认候选。</p>
<section><h2>桌面连接</h2><label>管理凭据<input id="adminToken" type="password" autocomplete="off" spellcheck="false"></label><button id="connect">连接</button><p id="status" role="status">尚未连接</p><p id="desktop"></p></section>
<section><h2>配对手机</h2><button id="createPairing">创建 2 分钟配对</button><p id="pairingInfo"></p><img id="pairingQr" hidden alt="手机扫描的临时配对二维码"><textarea id="pairingText" rows="5" readonly aria-label="手机导入文本"></textarea><p>将导入文本传给手机，并核对手机显示的桌面标识和校验串。文本只保留到配对过期。</p><label>输入手机显示的校验串<input id="confirmationCode" inputmode="numeric" maxlength="6" autocomplete="off"></label><button id="confirmPairing">确认配对</button></section>
<section><h2>已配对设备</h2><select id="device" aria-label="选择手机"></select><button id="refresh">刷新</button><button id="revoke">撤销选中设备</button></section>
<section><h2>创建短信等待窗口</h2><label>测试类型<select id="mode"><option value="synthetic">合成测试</option><option value="real">真实短信（自定义）</option><option value="huawei">华为验证码（106 号段）</option></select></label><div id="realRules" hidden><p>按实际短信填写精确发送方与正文标记。规则不匹配时不会接收。</p><label>站点<input id="site" value="test-site" maxlength="160"></label><label>发送方<input id="sender" maxlength="160"></label><label>正文标记<input id="bodyMarker" maxlength="200"></label><label>验证码位数<input id="codeLength" type="number" min="4" max="10" value="6"></label><label>SIM subscriptionId（可留空）<input id="subscriptionId" type="number" min="0"></label></div><label>手机号代号（无需完整号码）<input id="phoneKey" value="my-phone" maxlength="160"></label><button id="createChallenge">创建 120 秒请求</button><p>合成测试使用发送方 CareerOS、正文标记 CareerOS-Test 和 6 位数字。华为模式匹配 106 号段、【华为】签名和 6 位数字。真实短信请在创建请求后自行触发。</p></section>
<section><h2>请求与回填</h2><div id="challenges"></div><label>本地测试验证码输入框<input id="testCode" type="password" autocomplete="off" inputmode="numeric" readonly></label><p>点击“回填并确认消费”后代码仅短时存在于本页输入框，15 秒内清空。请求列表不展示验证码。</p></section>
</main></body></html>
